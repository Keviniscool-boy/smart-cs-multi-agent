services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required - set it in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_cs}
      MYSQL_USER: ${MYSQL_USER:-smart_cs_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required - set it in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      # 容器网络内固定指向服务名，忽略 .env 里的本机地址。
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # SQLite（auth/幂等/checkpoint）和向量索引持久化到宿主机。
      - ./data:/app/data
      - ./vector_store:/app/vector_store

  frontend:
    build:
      context: ./frontend
      args:
        # 浏览器从宿主机访问后端，走 compose 映射出来的 8000 端口。
        VITE_API_URL: http://localhost:8000
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - app

volumes:
  mysql_data:
